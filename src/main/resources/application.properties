spring.application.name=whattoeat-server

spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.ssl.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

account.email.encryption-key-location=${ACCOUNT_EMAIL_ENCRYPTION_KEY_LOCATION}
account.email.hmac-key-location=${ACCOUNT_EMAIL_HMAC_KEY_LOCATION}

jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
jwt.access-token-ttl=5m
jwt.refresh-token-ttl=30d

invitation.ttl=24h
invitation.cleanup-interval=1h
